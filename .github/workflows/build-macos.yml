name: Build macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Degrades gracefully: until the Apple Developer identity exists, the signing
# secrets are unset and the job builds an UNSIGNED universal .dmg (so CI never
# breaks while waiting on enrollment). Once APPLE_CERTIFICATE is set, the same
# job signs (hardened runtime), notarizes, and staples.
#
# IMPORTANT: the Apple secrets are passed ONLY to the steps that need them, never
# at job level. An EMPTY APPLE_CERTIFICATE in `tauri build`'s environment makes
# Tauri's bundler attempt `security import` and FAIL the build — so the unsigned
# build step is kept entirely free of APPLE_* vars.
#
# Required repo secrets to switch on signing + notarization:
#   APPLE_CERTIFICATE            base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD   the .p12 export password
#   APPLE_SIGNING_IDENTITY       "Developer ID Application: <Name> (<TEAMID>)"
#   KEYCHAIN_PASSWORD            any string (ephemeral CI keychain)
#   APPLE_ID / APPLE_PASSWORD    Apple account email + app-specific password
#   APPLE_TEAM_ID                your Team ID
# (Alternative to APPLE_ID/PASSWORD/TEAM_ID for notarization: the App Store
#  Connect API key — APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_PATH.)

jobs:
  build-macos:
    runs-on: macos-14
    env:
      # Boolean gate as a string ("true"/"false"). Secrets can't be read in
      # `if:` directly, and we must NOT expose APPLE_* at job level (see above).
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/models/ggml-base.en.bin
          key: whisper-model-base-en

      - name: Cache whisper.cpp build
        uses: actions/cache@v4
        with:
          path: .build/whisper.cpp
          key: whisper-cpp-universal-metal-${{ hashFiles('scripts/prepare-resources-macos.sh') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare macOS resources (universal + Metal)
        run: |
          chmod +x scripts/prepare-resources-macos.sh
          ./scripts/prepare-resources-macos.sh

      - name: Import Apple Developer certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'echo-ci-keychain' }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -t 21600 -u "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$RUNNER_TEMP/build.keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain"
          security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain"

      - name: Sign bundled whisper-server (hardened runtime)
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # The whisper-server resource is a separate Mach-O; notarization
          # requires every executable in the bundle to carry a hardened-runtime
          # Developer ID signature. Sign it here, BEFORE tauri build copies it
          # into Contents/Resources.
          codesign --force --options runtime --timestamp \
            --entitlements src-tauri/entitlements-helper.plist \
            --sign "$APPLE_SIGNING_IDENTITY" \
            src-tauri/resources/models/whisper-server
          codesign -dvvv src-tauri/resources/models/whisper-server || true

      # Two mutually-exclusive build steps so the UNSIGNED path never sees an
      # APPLE_* var (an empty one breaks Tauri's bundler at the codesign phase).
      - name: Build universal — unsigned (no Apple identity)
        if: env.HAS_APPLE_CERT != 'true'
        env:
          # Updater signing key (separate from the Apple identity); the in-app
          # updater verifies the served-file SHA, not a Tauri signature.
          TAURI_SIGNING_PRIVATE_KEY: ""
        run: npx tauri build --target universal-apple-darwin --verbose

      - name: Build universal — signed + notarized
        if: env.HAS_APPLE_CERT == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx tauri build --target universal-apple-darwin --verbose

      - name: Verify signature + notarization stapling
        if: env.HAS_APPLE_CERT == 'true'
        run: |
          APP="$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -n1)"
          DMG="$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -n1)"
          echo "Verifying $APP"
          # Gatekeeper assessment of the .app (the notarized + stapled artifact).
          spctl -a -vvv --type execute "$APP" || true
          # Hard gate: the app must carry a stapled notarization ticket.
          xcrun stapler validate "$APP"
          # The bundled whisper-server must keep its hardened-runtime signature —
          # i.e. Tauri's deep-sign of the .app didn't strip the helper's entitlements.
          codesign -dvvv "$APP/Contents/Resources/models/whisper-server" 2>&1 \
            | grep -i "flags.*runtime" \
            || { echo "ERROR: bundled whisper-server lost its hardened-runtime signature"; exit 1; }
          # The outer .dmg ticket is version-dependent / historically flaky — diagnostic only.
          echo "Verifying $DMG"
          xcrun stapler validate "$DMG" || true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: alan-echo-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: alan-echo-macos-universal-app
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

      - name: Create draft release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          draft: true
