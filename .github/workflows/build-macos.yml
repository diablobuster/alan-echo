name: Build macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/models/ggml-base.en.bin
          key: whisper-model-base-en

      - name: Cache whisper.cpp build
        uses: actions/cache@v4
        with:
          path: .build/whisper.cpp
          key: whisper-cpp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-resources-macos.sh') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare macOS resources
        run: |
          chmod +x scripts/prepare-resources-macos.sh
          ./scripts/prepare-resources-macos.sh

      - name: Build (aarch64 — Apple Silicon)
        run: npx tauri build --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: alan-echo-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: alan-echo-macos-arm64-app
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

      - name: Create draft release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          draft: true
